<svg xmlns="http://www.w3.org/2000/svg" width="380" height="170" viewBox="0 0 380 170" fill="none" role="img" aria-labelledby="title description" shape-rendering="geometricPrecision">
    <title id="title">Most Used Languages</title>
    <desc id="description">A breakdown of the programming languages used across public repositories.</desc>
    <defs>
        <clipPath id="bar-clip">
            <rect x="22" y="55" width="336" height="11" rx="6"/>
        </clipPath>
        <style>
            text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
            .heading { fill: #ff79c6; font-size: 16px; font-weight: 700; letter-spacing: .15px; }
            .eyebrow { fill: #6272a4; font-size: 8px; font-weight: 700; letter-spacing: 1.15px; }
            .name { fill: #f8f8f2; font-size: 12px; font-weight: 600; }
            .percent { fill: #a8adc2; font-size: 10px; font-weight: 650; }
            .empty-title { fill: #f8f8f2; font-size: 12px; font-weight: 600; }
            .empty-copy { fill: #6272a4; font-size: 10px; font-weight: 500; }
        </style>
    </defs>
    <rect x=".5" y=".5" width="379" height="169" rx="10" fill="#282a36" stroke="#44475a"/>
    <circle cx="27" cy="29" r="8" fill="#ff79c6" opacity=".12"/>
    <circle cx="27" cy="29" r="4" fill="#ff79c6"/>
    <text x="42" y="34" class="heading">Most Used Languages</text>
    <text x="358" y="32" text-anchor="end" class="eyebrow">PUBLIC REPOS</text>
    
    <g aria-label="Language distribution bar">
        <rect x="22" y="55" width="336" height="11" rx="6" fill="#20212b" stroke="#44475a"/>
        <g clip-path="url(#bar-clip)">
            <rect x="22.00" y="55" width="230.53" height="11" fill="#b07219"/>
            <rect x="252.53" y="55" width="44.96" height="11" fill="#3178c6"/>
            <rect x="297.49" y="55" width="37.16" height="11" fill="#f1e05a"/>
            <rect x="334.65" y="55" width="7.01" height="11" fill="#f34b7d"/>
            <rect x="341.66" y="55" width="5.16" height="11" fill="#563d7c"/>
            <rect x="346.81" y="55" width="11.19" height="11" fill="#6272a4"/>
        </g>
        <rect x="22.5" y="55.5" width="335" height="10" rx="5.5" stroke="#f8f8f2" stroke-opacity=".08"/>
    </g>
    
    
        <g transform="translate(22, 84)" aria-label="Java: 68.6%">
            <circle cx="6" cy="6" r="7" fill="#b07219" opacity=".13"/>
            <circle cx="6" cy="6" r="3.5" fill="#b07219"/>
            <text x="19" y="10" class="name">Java</text>
            <rect x="116" y="-4" width="44" height="20" rx="6" fill="#303241" stroke="#44475a"/>
            <text x="138" y="10" text-anchor="middle" class="percent">68.6%</text>
        </g>
        
        <g transform="translate(198, 84)" aria-label="TypeScript: 13.4%">
            <circle cx="6" cy="6" r="7" fill="#3178c6" opacity=".13"/>
            <circle cx="6" cy="6" r="3.5" fill="#3178c6"/>
            <text x="19" y="10" class="name">TypeScript</text>
            <rect x="116" y="-4" width="44" height="20" rx="6" fill="#303241" stroke="#44475a"/>
            <text x="138" y="10" text-anchor="middle" class="percent">13.4%</text>
        </g>
        
        <g transform="translate(22, 109)" aria-label="JavaScript: 11.1%">
            <circle cx="6" cy="6" r="7" fill="#f1e05a" opacity=".13"/>
            <circle cx="6" cy="6" r="3.5" fill="#f1e05a"/>
            <text x="19" y="10" class="name">JavaScript</text>
            <rect x="116" y="-4" width="44" height="20" rx="6" fill="#303241" stroke="#44475a"/>
            <text x="138" y="10" text-anchor="middle" class="percent">11.1%</text>
        </g>
        
        <g transform="translate(198, 109)" aria-label="C++: 2.1%">
            <circle cx="6" cy="6" r="7" fill="#f34b7d" opacity=".13"/>
            <circle cx="6" cy="6" r="3.5" fill="#f34b7d"/>
            <text x="19" y="10" class="name">C++</text>
            <rect x="116" y="-4" width="44" height="20" rx="6" fill="#303241" stroke="#44475a"/>
            <text x="138" y="10" text-anchor="middle" class="percent">2.1%</text>
        </g>
        
        <g transform="translate(22, 134)" aria-label="CSS: 1.5%">
            <circle cx="6" cy="6" r="7" fill="#563d7c" opacity=".13"/>
            <circle cx="6" cy="6" r="3.5" fill="#563d7c"/>
            <text x="19" y="10" class="name">CSS</text>
            <rect x="116" y="-4" width="44" height="20" rx="6" fill="#303241" stroke="#44475a"/>
            <text x="138" y="10" text-anchor="middle" class="percent">1.5%</text>
        </g>
        
        <g transform="translate(198, 134)" aria-label="Other: 3.3%">
            <circle cx="6" cy="6" r="7" fill="#6272a4" opacity=".13"/>
            <circle cx="6" cy="6" r="3.5" fill="#6272a4"/>
            <text x="19" y="10" class="name">Other</text>
            <rect x="116" y="-4" width="44" height="20" rx="6" fill="#303241" stroke="#44475a"/>
            <text x="138" y="10" text-anchor="middle" class="percent">3.3%</text>
        </g>
        
</svg>
